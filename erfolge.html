<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <script>
      /* Hydration-Boot: Seiteninhalt sofort ausblenden, wenn ein Supabase-
         Auth-Token existiert (angemeldet) - verhindert das Aufblitzen des
         leeren Standardspielers. Auflösung: JS/player.js + JS/auth.js. */
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.slice(0, 3) === "sb-" && k.indexOf("-auth-token") !== -1) {
              document.documentElement.setAttribute("data-hydrating", "1");
              return;
            }
          }
        } catch (e) {}
      })();
    </script>


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=59">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=20">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=5">

    <title>Erfolge – Mirelon</title>

</head>
