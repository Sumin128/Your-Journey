<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=21">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=14">

    <title>Passwort zurücksetzen – Mirelon</title>

    <style>
        /* Keine Sidebar auf dieser Seite (nur Ziel fuer den
           Passwort-Reset-Link aus der E-Mail) - der sonst dafuer
           reservierte linke Rand entfaellt hier. */
        main {
            margin-left: 0;
            justify-content: center;
        }

        .reset-password-card {
            max-width: 440px;
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .reset-password-card p {
            color: var(--yj-color-ink-soft);
            line-height: 1.5;
        }
    </style>

</head>


<body>


    <!-- =====================================================
         PASSWORT ZURUECKSETZEN
         Kein Link von irgendwo auf der Seite - das hier ist das
         Ziel, auf das requestPasswordReset() in JS/auth.js nach
         Klick auf den Link aus der Bestaetigungs-Mail umleitet.
         auth.js erkennt das PASSWORD_RECOVERY-Ereignis automatisch
         und oeffnet dann das schon vorhandene Passwort-Formular
         (das gleiche wie im Konto-Panel auf jeder anderen Seite) -
         hier muss also keine eigene Logik dafuer gebaut werden.
         ===================================================== -->

    <main id="reset-password-main" class="yj-page">

        <section class="reset-password-card yj-panel yj-panel--paper yj-enter">

            <h1>Passwort zurücksetzen</h1>

            <p>
                Einen Moment, wir prüfen deinen Link …
            </p>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=28"></script>
    <script src="JS/auth.js?v=8"></script>


</body>

</html>
