<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=20">

    <link

<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         BESTENLISTE
         ===================================================== -->

    <main id="highscore-main" class="yj-page">

        <section class="highscore-header yj-panel yj-panel--paper yj-enter">

            <h1>🏅 Bestenliste</h1>

            <p>
                Für jeden gewonnenen Durchgang bei Kuros Quiz,
                Tessas Wörterraten, Branos' Wer-ist-es und im
                Puzzle gibt es 10 Punkte – hier siehst du, wer
                in ganz Mirelon die meisten gesammelt hat.
            </p>

        </section>

        <section class="highscore-panel yj-panel yj-panel--paper yj-enter">

            <p id="highscorePersonalBest" class="highscore-personal-best" hidden></p>

            <p id="highscoreMessage" class="account-message" hidden></p>

            <ol class="highscore-list" id="highscoreList"></ol>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->
