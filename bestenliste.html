<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <script>
      /* Hydration-Boot: Seiteninhalt sofort ausblenden, wenn ein Supabase-
         Auth-Token existiert (angemeldet) - verhindert das Aufblitzen des
         leeren Standardspielers. Auflösung: JS/player.js + JS/auth.js. */
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.slice(0, 3) === "sb-" && k.indexOf("-auth-token") !== -1) {
              document.documentElement.setAttribute("data-hydrating", "1");
              return;
            }
          }
        } catch (e) {}
      })();
    </script>


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=54">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=20">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=5">

    <title>Bestenliste – Mirelon</title>

</head>


<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         BESTENLISTE
         ===================================================== -->

    <main id="highscore-main" class="yj-page">

        <section class="highscore-header yj-panel yj-panel--paper yj-enter">

            <h1>🏅 Bestenliste</h1>

            <p>
                Für jeden gewonnenen Durchgang bei Kuros Quiz,
                Tessas Wörterraten, Branos' Wer-ist-es und im
                Puzzle gibt es 10 Punkte – hier siehst du, wer
                in ganz Mirelon die meisten gesammelt hat.
            </p>

        </section>

        <section class="highscore-panel yj-panel yj-panel--paper yj-enter">

            <p id="highscorePersonalBest" class="highscore-personal-best" hidden></p>

            <p id="highscoreMessage" class="account-message" hidden></p>

            <ol class="highscore-list" id="highscoreList"></ol>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=36"></script>
    <script src="JS/level-data.js?v=2"></script>
    <script src="JS/level-up.js?v=3"></script>
    <script src="JS/auth.js?v=12"></script>
    <script src="JS/sidebar.js?v=27"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=10"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/confetti.js?v=1"></script>
    <script src="JS/highscore.js?v=1"></script>


</body>

</html>
