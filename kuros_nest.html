<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <script>
      /* Hydration-Boot: Seiteninhalt sofort ausblenden, wenn ein Supabase-
         Auth-Token existiert (angemeldet) - verhindert das Aufblitzen des
         leeren Standardspielers. Auflösung: JS/player.js + JS/auth.js. */
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.slice(0, 3) === "sb-" && k.indexOf("-auth-token") !== -1) {
              document.documentElement.setAttribute("data-hydrating", "1");
              return;
            }
          }
        } catch (e) {}
      })();
    </script>


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=59">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=20">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=5">

    <title>Kuros Nest – Mirelon</title>

</head>


<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         KUROS NEST
         ===================================================== -->

    <main id="kuro-main" class="yj-page">


        <div class="mirelon-feather-badge">

            <span
                id="feather-count"
                aria-live="polite">
                <img src="images/muenze.png" alt="" class="coin-icon"> 0 Münzen
            </span>

        </div>


        <section
            id="kuro-box"
            class="panel character-panel yj-panel yj-panel--paper yj-enter">

            <img
                src="images/Kuro_close.png"
                id="kuro-image"
                alt="Kuro"
                decoding="async">

            <div id="kuro-text">

                <h1 id="welcome-title">
                    Hallo!
                </h1>

                <p id="welcome-message">
                    Ich bin Kuro.
                    Schön, dass du wieder da bist.
                </p>

            </div>

        </section>


        <section
            id="quiz-select"
            class="panel quiz-panel yj-panel yj-panel--paper">

            <!-- Landing: Quizart wählen -->
            <div id="quiz-type-landing">

                <h2>Kuros Quiz</h2>

                <div class="quiz-type-list">

                    <button type="button" class="quiz-type-card" id="quiz-type-text">
                        <span class="quiz-type-icon" aria-hidden="true">🪶</span>
                        <span class="quiz-type-name">Text-Quiz</span>
                        <span class="quiz-type-desc">Fragen lesen, nachdenken und antworten.</span>
                    </button>

                    <button type="button" class="quiz-type-card" id="quiz-type-geraeusche">
                        <span class="quiz-type-icon" aria-hidden="true">🎵</span>
                        <span class="quiz-type-name">Geräusche-Quiz</span>
                        <span class="quiz-type-desc">Genau hinhören und Tiere oder Dinge erkennen.</span>
                    </button>

                </div>

            </div>

            <!-- Text-Quiz-Auswahl: Schritt 1 Thema, dann Schritt 2 Länge -->
            <div id="text-quiz-setup" hidden>

                <button type="button" id="text-quiz-back"
                    class="yj-button yj-button--secondary yj-button--compact">
                    ⬅️ Zurück
                </button>

                <h2>🪶 Kuros Text-Quiz</h2>

                <!-- Schritt 1: Thema wählen -->
                <div id="tq-step-category" class="tq-step">
                    <h3 id="tq-category-label">Worüber möchtest du rätseln?</h3>
                    <div id="text-quiz-categories" class="quiz-choice-grid"
                        role="group" aria-labelledby="tq-category-label"></div>
                </div>

                <!-- Schritt 2: Länge wählen (startet die Runde) -->
                <div id="tq-step-length" class="tq-step" hidden>
                    <h3 id="tq-length-label">
                        <span id="tq-chosen-category"></span>Wie viele Fragen möchtest du?
                    </h3>
                    <div id="text-quiz-lengths" class="quiz-choice-grid"
                        role="group" aria-labelledby="tq-length-label"></div>
                    <p id="text-quiz-hint" class="text-quiz-hint" hidden></p>
                </div>

            </div>

            <!-- Geräusche-Quiz-Auswahl (nur falls mehr als ein Geräusche-Quiz) -->
            <div id="geraeusche-setup" hidden>

                <button type="button" id="geraeusche-back"
                    class="yj-button yj-button--secondary yj-button--compact">
                    ⬅️ Zurück
                </button>

                <h2>🎵 Geräusche-Quiz</h2>

                <div id="geraeusche-list" class="quiz-choice-grid"></div>

            </div>

        </section>


        <div
            id="quiz-status"
            class="panel quiz-panel yj-panel yj-panel--paper"
            style="display:none;">

            <button
                id="quiz-exit-button"
                type="button"
                class="yj-button yj-button--secondary yj-button--compact">
                ⬅️ Quiz verlassen
            </button>

            <p
                id="progress-display"
                aria-live="polite"
                style="display:none;">
                Frage 1 von 5
            </p>

        </div>


        <section
            id="quiz-game-panel"
            class="panel quiz-panel yj-panel yj-panel--paper"
            style="display:none;">

            <div id="quiz-container">
                <!-- Quiz wird per JavaScript erzeugt -->
            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=39"></script>
    <script src="JS/level-data.js?v=2"></script>
    <script src="JS/level-up.js?v=3"></script>
    <script src="JS/auth.js?v=12"></script>

    <script src="JS/sidebar.js?v=29"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=10"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/confetti.js?v=1"></script>

    <script src="JS/data.js?v=4"></script>

    <script src="JS/sounds.js?v=1"></script>

    <script src="JS/quiz-catalog.js?v=4"></script>
    <script src="JS/quiz.js?v=8"></script>

    <script>
        const kuroWelcomeMessage = document.getElementById("welcome-message");

        if (kuroWelcomeMessage && typeof kuro !== "undefined" && kuro.welcome) {
            const randomIndex = Math.floor(Math.random() * kuro.welcome.length);
            kuroWelcomeMessage.textContent = kuro.welcome[randomIndex];
        }

        if (typeof markAnimalVisited === "function") {
            markAnimalVisited("kuro");
        }
    </script>


</body>

</html>
