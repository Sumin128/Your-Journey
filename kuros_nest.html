<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=34">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=16">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=2">

    <title>Kuros Nest – Mirelon</title>

</head>


<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         KUROS NEST
         ===================================================== -->

    <main id="kuro-main" class="yj-page">


        <div class="mirelon-feather-badge">

            <span
                id="feather-count"
                aria-live="polite">
                <img src="images/muenze.png" alt="" class="coin-icon"> 0 Münzen
            </span>

        </div>


        <section
            id="kuro-box"
            class="panel character-panel yj-panel yj-panel--paper yj-enter">

            <img
                src="images/Kuro_close.png"
                id="kuro-image"
                alt="Kuro"
                decoding="async">

            <div id="kuro-text">

                <h1 id="welcome-title">
                    Hallo!
                </h1>

                <p id="welcome-message">
                    Ich bin Kuro.
                    Schön, dass du wieder da bist.
                </p>

            </div>

        </section>


        <section
            id="quiz-select"
            class="panel quiz-panel yj-panel yj-panel--paper">

            <h2>
                Teste dein Wissen
            </h2>

            <div id="quiz-group-tabs">

                <button
                    type="button"
                    class="quiz-group-tab is-active"
                    data-quiz-group="wissen">
                    🧠 Wissen
                </button>

                <button
                    type="button"
                    class="quiz-group-tab"
                    data-quiz-group="geraeusche">
                    🔊 Geräusche
                </button>

            </div>

            <div id="quiz-category-select">

                <div id="quiz-category-buttons">
                    <!-- Kategorien werden per JavaScript erzeugt -->
                </div>

            </div>

            <div id="quiz-list-select" hidden>

                <button
                    id="quiz-back-to-categories"
                    type="button"
                    class="yj-button yj-button--secondary yj-button--compact">
                    ⬅️ Zurück zu Kategorien
                </button>

                <h3 id="quiz-category-title"></h3>

                <div id="quiz-select-buttons">
                    <!-- Quizze der gewählten Kategorie werden per JavaScript erzeugt -->
                </div>

            </div>

        </section>


        <div
            id="quiz-status"
            class="panel quiz-panel yj-panel yj-panel--paper"
            style="display:none;">

            <button
                id="quiz-exit-button"
                type="button"
                class="yj-button yj-button--secondary yj-button--compact">
                ⬅️ Quiz verlassen
            </button>

            <p
                id="score-display"
                style="display:none;">
                Punkte: 0
            </p>

            <p
                id="progress-display"
                style="display:none;">
                Frage 1 von 9
            </p>

        </div>


        <section
            id="quiz-game-panel"
            class="panel quiz-panel yj-panel yj-panel--paper"
            style="display:none;">

            <div id="quiz-container">
                <!-- Quiz wird per JavaScript erzeugt -->
            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=29"></script>
    <script src="JS/auth.js?v=8"></script>

    <script src="JS/sidebar.js?v=14"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=2"></script>
    <script src="JS/fireworks.js?v=1"></script>

    <script src="JS/data.js?v=3"></script>

    <script src="JS/sounds.js?v=1"></script>

    <script src="JS/quiz.js?v=5"></script>

    <script>
        const kuroWelcomeMessage = document.getElementById("welcome-message");

        if (kuroWelcomeMessage && typeof kuro !== "undefined" && kuro.welcome) {
            const randomIndex = Math.floor(Math.random() * kuro.welcome.length);
            kuroWelcomeMessage.textContent = kuro.welcome[randomIndex];
        }

        if (typeof markAnimalVisited === "function") {
            markAnimalVisited("kuro");
        }
    </script>


</body>

</html>
