    <link

        href="CSS/components/index.css?v=14">

<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar">

        <div class="sidebar-header">

            <button
                id="sidebar-toggle"
                type="button"
                aria-label="Menü öffnen">
                ☰
            </button>

<img
                src="images/magischer_baum_von_mirelon_logo.png"
                alt="Mirelon"
                class="sidebar-title sidebar-logo" decoding="async">

        </div>


        <div class="sidebar-player">

            <div class="sidebar-avatar-wrap">

                <img
                    id="sidebar-player-avatar"
                    src=""
                    alt="Spieler">

                <button
                    id="inventory-button"
                    type="button">
                    <img src="Icons/Sidebar/inventar.png" alt="" class="inventory-icon" decoding="async">
                </button>

            </div>

            <div class="sidebar-player-info">

                <strong id="sidebar-player-name">
                    Abenteurer
                </strong>

                <span id="sidebar-feathers">
                    <img src="images/muenze.png" alt="" class="coin-icon"> 0 Münzen
                </span>

                <span id="sidebar-achievements">
                    ⭐ 0 Erfolge
                </span>

            </div>

        </div>


        <div class="sidebar-divider"></div>


        <div class="sidebar-nav">

            <a
                href="index.html"
                class="sidebar-link">

                <span class="sidebar-icon"><img src="Icons/Sidebar/start.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Start</span>

            </a>


            <button type="button" class="sidebar-group-header">
                <span class="sidebar-icon"><img src="Icons/Sidebar/lernorte.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Weitere Orte</span>
                <span class="sidebar-chevron">▸</span>
            </button>

            <div class="sidebar-subnav">

                <a
                    href="kuros_nest.html"
                    class="sidebar-link sidebar-sublink"
                    aria-current="page">

                    <span class="sidebar-icon"><img src="Icons/Sidebar/rabe-2.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                    <span class="sidebar-label">Kuros Nest</span>

                </a>


                <a
                    href="eulenschule.html"
                    class="sidebar-link sidebar-sublink">

                    <span class="sidebar-icon"><img src="Icons/Sidebar/hase.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                    <span class="sidebar-label">Tessas Hasenschule</span>

                </a>


                <a
                    href="fuchs.html"
                    class="sidebar-link sidebar-sublink">

                    <span class="sidebar-icon"><img src="Icons/Sidebar/fuchs.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                    <span class="sidebar-label">Faros Fuchsbau</span>

                </a>


                <a
                    href="baerental.html"
                    class="sidebar-link sidebar-sublink">

                    <span class="sidebar-icon"><img src="Icons/Sidebar/baer-2.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                    <span class="sidebar-label">Bärental</span>

                </a>


                <a
                    href="puzzle.html"
                    class="sidebar-link sidebar-sublink">

                    <span class="sidebar-icon"><img src="Icons/Sidebar/chamaeleon.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                    <span class="sidebar-label">Luis Puzzle</span>

                </a>

            </div>


            <button type="button" class="sidebar-group-header">
                <span class="sidebar-icon"><img src="Icons/Sidebar/kreativ.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Kreativ</span>
                <span class="sidebar-chevron">▸</span>
            </button>

            <div class="sidebar-subnav">

                <a
                    href="malen.html"
                    class="sidebar-link sidebar-sublink">

                    <span class="sidebar-icon"><img src="Icons/Sidebar/malen.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                    <span class="sidebar-label">Malstube</span>

                </a>


                <a
                    href="galerie.html"
                    class="sidebar-link sidebar-sublink">

                    <span class="sidebar-icon"><img src="Icons/Sidebar/galerie.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                    <span class="sidebar-label">Galerie</span>

                </a>

            </div>


            <a
                href="shop_seite.html"
                class="sidebar-link">

                <span class="sidebar-icon"><img src="Icons/Sidebar/shop.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Kuros Laden</span>

            </a>


           


            <a
                href="erfolge.html"
                class="sidebar-link">

                <span class="sidebar-icon"><img src="Icons/Sidebar/erfolge.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Erfolge</span>

            </a>

            <a
                href="bestenliste.html"
                class="sidebar-link">

                <span class="sidebar-icon"><img src="Icons/Sidebar/highscore.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Bestenliste</span>

            </a>

        </div>


        <div class="sidebar-divider"></div>


        <div class="sidebar-utility">

            <a
                href="einstellungen.html"
                class="sidebar-link">

                <span class="sidebar-icon"><img src="Icons/Sidebar/einstellungen.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Einstellungen</span>

            </a>

            <a href="impressum.html" class="sidebar-link sidebar-legal-link">

                <span class="sidebar-icon"><img src="Icons/Sidebar/impressum.png" alt="" class="sidebar-icon-img" decoding="async"></span>
                <span class="sidebar-label">Impressum & Datenschutz</span>

            </a>

        </div>

    </nav>


    <!-- =====================================================
         KUROS NEST
         ===================================================== -->

    <main id="kuro-main" class="yj-page">


        <div class="mirelon-feather-badge">

            <span
                id="feather-count"
                aria-live="polite">
                <img src="images/muenze.png" alt="" class="coin-icon"> 0 Münzen
            </span>

        </div>


        <section
            id="kuro-box"
            class="panel character-panel yj-panel yj-panel--paper yj-enter">

            <img
                src="images/Kuro_close.png"
                id="kuro-image"
                alt="Kuro"
                decoding="async">

            <div id="kuro-text">

                <h1 id="welcome-title">
                    Hallo!
                </h1>

                <p id="welcome-message">
                    Ich bin Kuro.
                    Schön, dass du wieder da bist.
                </p>

            </div>

        </section>


        <section
            id="quiz-select"
            class="panel quiz-panel yj-panel yj-panel--paper">

            <h2>
                Teste dein Wissen
            </h2>

            <div id="quiz-category-select">

                <div id="quiz-category-buttons">
                    <!-- Kategorien werden per JavaScript erzeugt -->
                </div>

            </div>

            <div id="quiz-list-select" hidden>

                <button
                    id="quiz-back-to-categories"
                    type="button"
                    class="yj-button yj-button--secondary yj-button--compact">
                    ⬅️ Zurück zu Kategorien
                </button>

                <h3 id="quiz-category-title"></h3>

                <div id="quiz-select-buttons">
                    <!-- Quizze der gewählten Kategorie werden per JavaScript erzeugt -->
                </div>

            </div>

        </section>


        <div
            id="quiz-status"
            class="panel quiz-panel yj-panel yj-panel--paper"
            style="display:none;">

            <button
                id="quiz-exit-button"
                type="button"
                class="yj-button yj-button--secondary yj-button--compact">
                ⬅️ Quiz verlassen
            </button>

            <p
                id="score-display"
                style="display:none;">
                Punkte: 0
            </p>

            <p
                id="progress-display"
                style="display:none;">
                Frage 1 von 9
            </p>

        </div>


        <section
            id="quiz-game-panel"
            class="panel quiz-panel yj-panel yj-panel--paper"
            style="display:none;">

            <div id="quiz-container">
                <!-- Quiz wird per JavaScript erzeugt -->
            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=22"></script>
    <script src="JS/auth.js?v=2"></script>

    <script src="JS/sidebar.js?v=10"></script>
    <script src="JS/bugreport.js?v=1"></script>

    <script src="JS/data.js?v=2"></script>

    <script src="JS/sounds.js?v=1"></script>

    <script src="JS/quiz.js?v=2"></script>

    <script>
        const kuroWelcomeMessage = document.getElementById("welcome-message");

        if (kuroWelcomeMessage && typeof kuro !== "undefined" && kuro.welcome) {
            const randomIndex = Math.floor(Math.random() * kuro.welcome.length);
            kuroWelcomeMessage.textContent = kuro.welcome[randomIndex];
        }

        if (typeof markAnimalVisited === "function") {
            markAnimalVisited("kuro");
        }
    </script>


</body>

</html>
