<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=41">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=18">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=4">
    <link rel="stylesheet" href="CSS/schloss.css?v=16">

    <!-- Three.js als ES-Modul, fest auf 0.160.0 gepinnt (kein Build-
         Schritt in diesem Projekt). Vorerst über jsdelivr, sobald die
         3D-Szene steht: lokal unter JS/vendor/ ausliefern statt
         dauerhaft von einem externen CDN abhängig zu sein. Addons
         (GLTFLoader für spätere echte .glb-Möbel) aus demselben,
         versionsgleichen Paket. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <title>Mein Schloss</title>

</head>
<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         MEIN SCHLOSS
         ===================================================== -->

    <main class="yj-page schloss-page">

        <section id="schloss-locked" class="schloss-locked yj-panel yj-panel--paper yj-enter" hidden>

            <h1>🏰 Mein Schloss</h1>
            <p id="schloss-locked-text"></p>
            <a href="index.html" class="yj-button yj-button--wide">Zurück zur Karte</a>

        </section>

        <section id="schloss-editor" class="schloss-editor" hidden>

            <div id="schloss-scene-wrap" class="schloss-scene-wrap">

                <canvas id="schloss-canvas" aria-label="Dein Schlosszimmer, ein 3D-Raum zum Einrichten"></canvas>

                <span class="schloss-scene-title" aria-hidden="true">🏰 Mein Schloss</span>

                <div id="schloss-rotate-controls" class="schloss-rotate-controls" hidden>

                    <div id="schloss-color-swatches" class="schloss-item-menu-colors" hidden></div>

                    <div class="schloss-rotate-buttons">
                        <button type="button" id="schloss-rotate-left" aria-label="Nach links drehen">↺</button>
                        <button type="button" id="schloss-light-toggle" class="schloss-light-toggle" aria-label="Lampe an oder aus" aria-pressed="true" hidden>💡</button>
                        <button type="button" id="schloss-rotate-remove" aria-label="Möbel entfernen">🗑️</button>
                        <button type="button" id="schloss-rotate-right" aria-label="Nach rechts drehen">↻</button>
                    </div>

                </div>

            </div>

            <!-- Einrichtungs-Schublade: nimmt so wenig Höhe wie möglich,
                 damit die 3D-Ansicht großflächig bleibt. Einklappbar. -->
            <div id="schloss-drawer" class="schloss-drawer">

                <div class="schloss-tabs" role="tablist">
                    <button type="button" id="schloss-drawer-toggle" class="schloss-drawer-toggle" aria-label="Schublade ein-/ausklappen" aria-expanded="true">▾</button>
                    <button type="button" class="schloss-tab is-active" data-schloss-tab="inventory">🪑 Inventar</button>
                    <button type="button" class="schloss-tab" data-schloss-tab="style">🎨 Stil</button>
                    <a href="tamo_werkstatt.html" class="schloss-tab schloss-tab--link">🪵 Neue Möbel bei Tamo</a>
                </div>

                <div id="schloss-drawer-body" class="schloss-drawer-body">
                    <div id="schloss-inventory" class="schloss-inventory" aria-label="Deine Möbel"></div>
                    <div id="schloss-style" class="schloss-style" aria-label="Einrichtungs-Stil" hidden></div>
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=30"></script>
    <script src="JS/level-data.js?v=1"></script>
    <script src="JS/level-up.js?v=1"></script>
    <script src="JS/auth.js?v=9"></script>
    <script src="JS/sidebar.js?v=16"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=8"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/sounds.js?v=1"></script>
    <script src="JS/schloss-data.js?v=15"></script>
    <script src="JS/schloss.js?v=6"></script>
    <script src="JS/schloss-migration.js?v=1"></script>
    <script type="module" src="JS/schloss-3d.js?v=24"></script>

</body>
</html>
