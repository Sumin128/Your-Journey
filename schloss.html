<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <script>
      /* Hydration-Boot: Seiteninhalt sofort ausblenden, wenn ein Supabase-
         Auth-Token existiert (angemeldet) - verhindert das Aufblitzen des
         leeren Standardspielers. Auflösung: JS/player.js + JS/auth.js. */
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.slice(0, 3) === "sb-" && k.indexOf("-auth-token") !== -1) {
              document.documentElement.setAttribute("data-hydrating", "1");
              return;
            }
          }
        } catch (e) {}
      })();
    </script>


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=57">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=20">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=5">
    <link rel="stylesheet" href="CSS/schloss.css?v=22">

    <!-- Three.js als ES-Modul, fest auf 0.160.0 gepinnt (kein Build-
         Schritt in diesem Projekt). Vorerst über jsdelivr, sobald die
         3D-Szene steht: lokal unter JS/vendor/ ausliefern statt
         dauerhaft von einem externen CDN abhängig zu sein. Addons
         (GLTFLoader für spätere echte .glb-Möbel) aus demselben,
         versionsgleichen Paket. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <title>Mein Schloss</title>

</head>
<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         MEIN SCHLOSS
         ===================================================== -->

    <main class="yj-page schloss-page">

        <section id="schloss-locked" class="schloss-locked yj-panel yj-panel--paper yj-enter" hidden>

            <h1>🏰 Mein Schloss</h1>
            <p id="schloss-locked-text"></p>
            <a href="index.html" class="yj-button yj-button--wide">Zurück zur Karte</a>

        </section>

        <!-- Einmaliger Einrichtungsstart (erster Schlossbesuch nach der
             Freischaltung). Steuerung: JS/schloss-starter.js. -->
        <section id="schloss-starter" class="schloss-starter yj-panel yj-panel--paper yj-enter" hidden></section>

        <section id="schloss-editor" class="schloss-editor" hidden>

            <div id="schloss-scene-wrap" class="schloss-scene-wrap">

                <canvas id="schloss-canvas" aria-label="Dein Schlosszimmer, ein 3D-Raum zum Einrichten"></canvas>

                <span class="schloss-scene-title" aria-hidden="true">🏰 Mein Schloss</span>

                <button type="button" id="schloss-fire-toggle" class="schloss-fire-toggle" aria-label="Kaminfeuer an oder aus" aria-pressed="true" hidden>🔥</button>

                <div id="schloss-rotate-controls" class="schloss-rotate-controls" hidden>

                    <div id="schloss-color-swatches" class="schloss-item-menu-colors" hidden></div>

                    <div class="schloss-rotate-buttons">
                        <button type="button" id="schloss-rotate-left" aria-label="Nach links drehen (kleiner Schritt)">↺</button>
                        <button type="button" id="schloss-rotate-snap" class="schloss-rotate-snap" aria-label="Drehung im 15-Grad-Raster einrasten" title="15°-Raster an oder aus" aria-pressed="false" hidden>15°</button>
                        <button type="button" id="schloss-light-toggle" class="schloss-light-toggle" aria-label="Lampe an oder aus" aria-pressed="true" hidden>💡</button>
                        <button type="button" id="schloss-rotate-remove" aria-label="Möbel entfernen">🗑️</button>
                        <button type="button" id="schloss-rotate-right" aria-label="Nach rechts drehen (kleiner Schritt)">↻</button>
                    </div>

                </div>

            </div>

            <!-- Einrichtungs-Schublade: nimmt so wenig Höhe wie möglich,
                 damit die 3D-Ansicht großflächig bleibt. Einklappbar. -->
            <div id="schloss-drawer" class="schloss-drawer">

                <div class="schloss-tabs" role="tablist">
                    <button type="button" id="schloss-drawer-toggle" class="schloss-drawer-toggle" aria-label="Schublade ein-/ausklappen" aria-expanded="true">▾</button>
                    <button type="button" class="schloss-tab is-active" data-schloss-tab="inventory">🪑 Inventar</button>
                    <button type="button" class="schloss-tab" data-schloss-tab="style">🖌️ Raum gestalten</button>
                </div>

                <div id="schloss-drawer-body" class="schloss-drawer-body">
                    <div id="schloss-inv-cats" class="schloss-inv-cats" role="tablist" aria-label="Möbel-Kategorien"></div>
                    <div id="schloss-inventory" class="schloss-inventory" aria-label="Deine Möbel"></div>
                    <div id="schloss-style" class="schloss-style" aria-label="Raum gestalten" hidden></div>
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=39"></script>
    <script src="JS/level-data.js?v=2"></script>
    <script src="JS/level-up.js?v=3"></script>
    <script src="JS/auth.js?v=12"></script>
    <script src="JS/sidebar.js?v=28"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=10"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/confetti.js?v=1"></script>
    <script src="JS/sounds.js?v=1"></script>
    <script src="JS/schloss-data.js?v=35"></script>
    <script src="JS/schloss-starter.js?v=1"></script>
    <script src="JS/schloss.js?v=12"></script>
    <script src="JS/schloss-migration.js?v=1"></script>
    <script type="module" src="JS/schloss-3d.js?v=47"></script>

</body>
</html>
