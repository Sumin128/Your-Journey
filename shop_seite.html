<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=41">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=17">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=4">

    <title>Kuros Laden</title>

</head>
<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>

    <!-- =====================================================
         KUROS LADEN
         ===================================================== -->

    <main id="shop-main" class="yj-page">

        <section id="shop-scene" aria-label="Kuros Laden">

            <img
                id="shop-image"
                src="images/kuro_shop_1.png"
                alt="Kuro hinter dem Verkaufstresen mit zwei Regalböden für seine Waren"
                decoding="async">

            <div id="shop-feathers" aria-live="polite">
                <span class="shop-feather-icon" aria-hidden="true"></span>
                <span id="feather-count"><img src="images/muenze.png" alt="" class="coin-icon"> 0 Münzen</span>
                <small id="shop-player-name">Dein Vorrat</small>
            </div>

            <div id="shop-items">

                <div class="shop-hotspot shop-item-one" id="fox-cursor-item">

                    <img src="Icons/Cursor/fox_cursor.png" alt="Fuchs-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Fuchs-Cursor</strong>
                        <span>30 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="fox-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>


                <div class="shop-hotspot shop-item-five" id="kuro-cursor-item">

                    <img src="Icons/Cursor/kuro_cursor.png" alt="Kuro-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Kuro-Cursor</strong>
                        <span>90 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="kuro-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>


                <div class="shop-hotspot shop-item-two" id="bear-cursor-item">

                    <img src="Icons/Cursor/bear_cursor.png" alt="Bären-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Bären-Cursor</strong>
                        <span>40 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="bear-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>


                <div class="shop-hotspot shop-item-three">

                    <img src="Icons/Cursor/unicorn_cursor.png" alt="Einhorn-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Einhorn-Cursor</strong>
                        <span>200 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="unicorn-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>


                <div class="shop-hotspot shop-item-four" id="hasen-cursor-item">

                    <img src="Icons/Cursor/hasen_cursor.png" alt="Hasen-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Hasen-Cursor</strong>
                        <span>100 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="hasen-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>


                <div class="shop-hotspot shop-item-six" id="golden-feather-cursor-item">

                    <img src="Icons/Cursor/golden_feather_cursor.png" alt="Goldene-Feder-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Goldene Feder-Cursor</strong>
                        <span>300 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="golden-feather-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>


                <div class="shop-hotspot shop-item-seven" id="blackgolden-feather-cursor-item">

                    <img src="Icons/Cursor/blackgolden_feather_cursor.png" alt="Schwarzgoldene-Feder-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Schwarzgoldene Feder-Cursor</strong>
                        <span>300 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="blackgolden-feather-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>


                <div class="shop-hotspot shop-item-eight" id="luis-cursor-item">

                    <img src="Icons/Cursor/luis_cursor.png" alt="Luis-Cursor" class="shop-hotspot-icon">

                    <div class="shop-hotspot-tooltip">
                        <strong>Luis-Cursor</strong>
                        <span>500 <img src="images/muenze.png" alt="" class="coin-icon"></span>
                        <button type="button" id="luis-cursor-button" class="yj-button yj-button--compact">
                            Kaufen
                        </button>
                    </div>

                </div>

            </div>

            <p id="shop-message">
                Entdecke Kuros Fundstücke!
            </p>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=29"></script>
    <script src="JS/auth.js?v=8"></script>
    <script src="JS/sidebar.js?v=14"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=7"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/shop.js?v=10"></script>
    <script src="JS/sounds.js?v=1"></script>
</body>
</html>
