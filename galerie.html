<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=28">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=16">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=2">

    <title>Galerie – Mirelon</title>

</head>


<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         GALERIE
         ===================================================== -->

    <main id="gallery-main" class="yj-page">

        <section class="gallery-header yj-panel yj-panel--paper yj-enter">
            <h1>Galerie - Erkunde die Welten</h1>
            <p>Klicke auf eine Karte um sie in voller Größe anzuschauen.</p>
        </section>

        <div class="gallery-grid" id="gallery-grid">

            <section class="map-card yj-card yj-card--interactive" data-map-id="uebersichtskarte">
                <div class="map-card-title-row">
                    <h3>Übersichtskarte</h3>
                </div>

                <img
                    src="images/startseite_v4.jpg"
                    alt="Übersichtskarte von Kuros Wald"
                    class="map-image"
                    data-full="images/startseite_v4.jpg">
            </section>

            <section class="map-card yj-card yj-card--interactive" data-map-id="kuros-nest">
                <div class="map-card-title-row">
                    <h3>Kuros Nest</h3>
                </div>

                <img
                    src="images/kuros_nest_final.png"
                    alt="Kuros Nest Karte"
                    class="map-image"
                    data-full="images/kuros_nest_final.png"
                    loading="lazy">
            </section>

            <section class="map-card yj-card yj-card--interactive" data-map-id="eulenschule">
                <div class="map-card-title-row">
                    <h3>Tessas Hasenschule</h3>
                </div>

                <img
                    src="images/hasenschule.png"
                    alt="Tessas Hasenschule Karte"
                    class="map-image"
                    data-full="images/hasenschule.png"
                    loading="lazy">
            </section>

            <section class="map-card yj-card yj-card--interactive" data-map-id="fuchsbau">
                <div class="map-card-title-row">
                    <h3>Faros Fuchsbau</h3>
                </div>

                <img
                    src="images/faros_fuchsbau3.png"
                    alt="Faros Fuchsbau Karte"
                    class="map-image"
                    data-full="images/faros_fuchsbau3.png"
                    loading="lazy">
            </section>

            <section class="map-card yj-card yj-card--interactive" data-map-id="baerental">
                <div class="map-card-title-row">
                    <h3>Bärental</h3>
                </div>

                <img
                    src="images/baerenthal.png"
                    alt="Bärental Karte"
                    class="map-image"
                    data-full="images/baerenthal.png"
                    loading="lazy">
            </section>

            <section class="map-card yj-card yj-card--interactive" data-map-id="luis">
                <div class="map-card-title-row">
                    <h3>Luis</h3>
                </div>

                <img
                    src="images/luis_chameleon.png"
                    alt="Luis, das Chamäleon"
                    class="map-image"
                    data-full="images/luis_chameleon.png"
                    loading="lazy">
            </section>

            <section class="map-card yj-card yj-card--interactive" data-map-id="luis-huette">
                <div class="map-card-title-row">
                    <h3>Luis' Hütte</h3>
                </div>

                <img
                    src="images/luis_huette.png"
                    alt="Luis in seiner Hütte beim Malen und Puzzeln"
                    class="map-image"
                    data-full="images/luis_huette.png"
                    loading="lazy">
            </section>

        </div>
        


        <section  class="my-drawings-section yj-panel yj-panel--paper yj-enter">

            <h2>🖼️ Meine Bilder</h2>

            <p id="my-drawings-guest-hint" class="account-message" hidden>
                Melde dich an, um deine gemalten Bilder hier zu sehen und zu speichern.
            </p>

            <p id="my-drawings-message" class="account-message" hidden></p>

            <div class="my-drawings-grid" id="my-drawings-grid">

                <div class="my-drawing-box"></div>
                <div class="my-drawing-box"></div>
                <div class="my-drawing-box"></div>
                <div class="my-drawing-box"></div>

            </div>

            <div class="my-drawings-pagination" id="my-drawings-pagination" hidden>

                <button type="button" id="my-drawings-prev" class="yj-button yj-button--compact">
                    ◀ Zurück
                </button>

                <span id="my-drawings-page-label">Seite 1 von 1</span>

                <button type="button" id="my-drawings-next" class="yj-button yj-button--compact">
                    Weiter ▶
                </button>

            </div>

        </section>

    </main>

    <div id="map-modal" class="map-modal">
        <div class="map-modal-content">
            <button id="map-modal-close" class="map-modal-close" aria-label="Schließen">×</button>
            <img id="map-modal-img" src="images/Kuroswelten1.png" alt="Große Karte" loading="lazy">
        </div>
    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=29"></script>
    <script src="JS/auth.js?v=8"></script>
    <script src="JS/sidebar.js?v=14"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=2"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/map.js?v=1"></script>
    <script src="JS/my-drawings.js?v=1"></script>
    <script src="JS/sounds.js?v=1"></script>


</body>

</html>
