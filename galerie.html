<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=41">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=17">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=3">

    <title>Galerie – Mirelon</title>

</head>


<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>


    <!-- =====================================================
         GALERIE
         ===================================================== -->

    <main id="gallery-main" class="yj-page">

        <section class="gallery-header yj-panel yj-panel--paper yj-enter">
            <h1>🖼️ Galerie</h1>
            <p>Die gemalten Welten von Mirelon – und deine eigenen Bilder.</p>
        </section>


        <!-- Die Welten -->
        <section class="gallery-section yj-panel yj-panel--paper yj-enter">

            <div class="gallery-section-head">
                <h2>Die Welten</h2>
                <span class="gallery-count">7 Orte</span>
            </div>

            <div class="gallery-grid" id="gallery-grid">

                <figure class="gallery-card" data-full="images/startseite_v4.jpg" tabindex="0" role="button" aria-label="Übersichtskarte ansehen">
                    <img src="images/startseite_v4.jpg" alt="Übersichtskarte von Kuros Wald" class="gallery-card-img">
                    <figcaption class="gallery-card-bar"><span>Übersichtskarte</span><span class="gallery-card-zoom" aria-hidden="true">🔍</span></figcaption>
                </figure>

                <figure class="gallery-card" data-full="images/kuros_nest_final.png" tabindex="0" role="button" aria-label="Kuros Nest ansehen">
                    <img src="images/kuros_nest_final.png" alt="Kuros Nest" class="gallery-card-img" loading="lazy">
                    <figcaption class="gallery-card-bar"><span>Kuros Nest</span><span class="gallery-card-zoom" aria-hidden="true">🔍</span></figcaption>
                </figure>

                <figure class="gallery-card" data-full="images/hasenschule.png" tabindex="0" role="button" aria-label="Tessas Hasenschule ansehen">
                    <img src="images/hasenschule.png" alt="Tessas Hasenschule" class="gallery-card-img" loading="lazy">
                    <figcaption class="gallery-card-bar"><span>Tessas Hasenschule</span><span class="gallery-card-zoom" aria-hidden="true">🔍</span></figcaption>
                </figure>

                <figure class="gallery-card" data-full="images/faros_fuchsbau3.png" tabindex="0" role="button" aria-label="Faros Fuchsbau ansehen">
                    <img src="images/faros_fuchsbau3.png" alt="Faros Fuchsbau" class="gallery-card-img" loading="lazy">
                    <figcaption class="gallery-card-bar"><span>Faros Fuchsbau</span><span class="gallery-card-zoom" aria-hidden="true">🔍</span></figcaption>
                </figure>

                <figure class="gallery-card" data-full="images/baerenthal.png" tabindex="0" role="button" aria-label="Bärental ansehen">
                    <img src="images/baerenthal.png" alt="Bärental" class="gallery-card-img" loading="lazy">
                    <figcaption class="gallery-card-bar"><span>Bärental</span><span class="gallery-card-zoom" aria-hidden="true">🔍</span></figcaption>
                </figure>

                <figure class="gallery-card" data-full="images/luis_chameleon.png" tabindex="0" role="button" aria-label="Luis ansehen">
                    <img src="images/luis_chameleon.png" alt="Luis, das Chamäleon" class="gallery-card-img" loading="lazy">
                    <figcaption class="gallery-card-bar"><span>Luis</span><span class="gallery-card-zoom" aria-hidden="true">🔍</span></figcaption>
                </figure>

                <figure class="gallery-card" data-full="images/luis_huette.png" tabindex="0" role="button" aria-label="Luis' Hütte ansehen">
                    <img src="images/luis_huette.png" alt="Luis in seiner Hütte beim Malen und Puzzeln" class="gallery-card-img" loading="lazy">
                    <figcaption class="gallery-card-bar"><span>Luis' Hütte</span><span class="gallery-card-zoom" aria-hidden="true">🔍</span></figcaption>
                </figure>

            </div>

        </section>


        <!-- Meine Bilder -->
        <section class="gallery-section yj-panel yj-panel--paper yj-enter">

            <div class="gallery-section-head">
                <h2>Meine Bilder</h2>
                <a href="malen.html" class="yj-button yj-button--compact">🎨 Malen</a>
            </div>

            <p id="my-drawings-message" class="account-message" hidden></p>

            <div class="my-drawings-empty" id="my-drawings-empty" hidden></div>

            <div class="gallery-grid my-drawings-grid" id="my-drawings-grid" hidden></div>

            <div class="my-drawings-pagination" id="my-drawings-pagination" hidden>

                <button type="button" id="my-drawings-prev" class="yj-button yj-button--compact">
                    ◀ Zurück
                </button>

                <span id="my-drawings-page-label">Seite 1 von 1</span>

                <button type="button" id="my-drawings-next" class="yj-button yj-button--compact">
                    Weiter ▶
                </button>

            </div>

        </section>

    </main>

    <div id="map-modal" class="map-modal">
        <div class="map-modal-content">
            <button id="map-modal-close" class="map-modal-close" aria-label="Schließen">×</button>
            <img id="map-modal-img" src="" alt="Bild in voller Größe">
        </div>
    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=29"></script>
    <script src="JS/auth.js?v=8"></script>
    <script src="JS/sidebar.js?v=14"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=5"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/map.js?v=2"></script>
    <script src="JS/my-drawings.js?v=2"></script>
    <script src="JS/sounds.js?v=1"></script>


</body>

</html>
