<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=33">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=16">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=2">

    <title>Faros Fuchsbau – Mirelon</title>

</head>

<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>

    <!-- =====================================================
         FAROS FUCHSBAU
         ===================================================== -->

    <main id="faro-main" class="yj-page">

        <div class="mirelon-feather-badge">

            <span id="feather-count" aria-live="polite">
                <img src="images/muenze.png" alt="" class="coin-icon"> 0 Münzen
            </span>

        </div>


        <section
            id="faro-intro"
            class="panel character-panel yj-panel yj-panel--paper yj-enter">

            <div id="faro-left">

                <img
                    id="faro-image"
                    src="images/faro1.png"
                    alt="Faro, der Fuchs"
                    decoding="async">

                <div id="flinkfunk-box">

                    <img
                        id="flinkfunk-radio"
                        src="Icons/faro/faros_radio96x96.png"
                        alt="Flinkfunk Radio"
                        decoding="async">

                    <p id="flinkfunk-text">
                        Flinkfunk
                    </p>

                </div>

            </div>

            <div id="faro-dialog">

                <h1>Faros Fuchsbau</h1>

                <p id="faro-text">
                    Meine Nase und meine Augen sind die besten im ganzen Wald.
                    Komm, ich zeige dir ein paar Spür-Spiele!
                </p>

            </div>

        </section>


        <!-- =====================================================
             SPIELE-MENÜ
             ===================================================== -->

        <section
            id="faro-games"
            class="panel quiz-panel yj-panel yj-panel--paper">

            <h2>Faros Spür-Spiele</h2>

            <div id="faro-game-buttons">
                <!-- Spiel-Buttons werden per JavaScript erzeugt -->
            </div>

        </section>


        <button
            id="faro-back-to-games"
            type="button"
            class="yj-button yj-button--secondary yj-button--wide"
            hidden>
            ⬅️ Zurück zu den Spielen
        </button>


        <section id="faro-game-stage" class="quiz-panel yj-panel yj-panel--paper" hidden>
            <!-- aktives Spiel wird per JavaScript hier hineingebaut -->
        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=29"></script>
    <script src="JS/auth.js?v=8"></script>

    <script src="JS/sidebar.js?v=14"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=2"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/sounds.js?v=1"></script>
    <script src="JS/fuchs.js?v=7"></script>
    <script src="JS/faro-tracks.js?v=1"></script>
    <script src="JS/faro-schatten.js?v=1"></script>
    <script src="JS/faro-faehrten.js?v=2"></script>
    <script src="JS/faro-verstecke.js?v=1"></script>
    <script src="JS/faro-memory.js?v=1"></script>

</body>

</html>
