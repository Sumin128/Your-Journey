<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=26">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=16">
    <link rel="stylesheet" href="CSS/tamagotchi.css?v=2">

    <title>Faros Fuchsbau – Mirelon</title>

</head>

<body>


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <nav id="sidebar"></nav>

    <!-- =====================================================
         FAROS FUCHSBAU
         ===================================================== -->

    <main id="faro-main" class="yj-page">

        <div class="mirelon-feather-badge">

            <span id="feather-count" aria-live="polite">
                <img src="images/muenze.png" alt="" class="coin-icon"> 0 Münzen
            </span>

        </div>


        <section
            id="faro-intro"
            class="panel character-panel yj-panel yj-panel--paper yj-enter">

            <div id="faro-left">

                <img
                    id="faro-image"
                    src="images/faro1.png"
                    alt="Faro, der Fuchs"
                    decoding="async">

                <div id="flinkfunk-box">

                    <img
                        id="flinkfunk-radio"
                        src="Icons/faro/faros_radio96x96.png"
                        alt="Flinkfunk Radio"
                        decoding="async">

                    <p id="flinkfunk-text">
                        Flinkfunk
                    </p>

                </div>

            </div>

            <div id="faro-dialog">

                <h1>Faros Fuchsbau</h1>

                <p id="faro-text">
                    Pssst … hör genau hin!
                    Meine Ohren haben ein Geräusch entdeckt.
                    Kannst du mir sagen, was das für ein Geräusch ist?
                </p>

            </div>

        </section>


        <section
            id="faro-quiz-select"
            class="panel quiz-panel yj-panel yj-panel--paper">

            <h2>Wähle ein Geräuschequiz</h2>

            <button
                type="button"
                id="animal-sounds-button"
                class="yj-button">
                🐾 Tiergeräusche
            </button>

            <button
                type="button"
                id="everyday-sounds-button"
                class="yj-button">
                🏡 Alltagsgeräusche
            </button>

            <button
                type="button"
                id="household-sounds-button"
                class="yj-button">
                🫖 Haushaltsgeräusche
            </button>

            <button
                type="button"
                id="nature-sounds-button"
                class="yj-button">
                🍃 Naturgeräusche
            </button>

        </section>


        <button
            id="back-to-quizzes"
            type="button"
            class="yj-button yj-button--secondary yj-button--wide"
            hidden>
            ⬅️ Zur Quizauswahl
        </button>


        <section id="sound-quiz" class="quiz-panel yj-panel yj-panel--paper" hidden>

            <h2 id="sound-question">
                Welches Tier macht dieses Geräusch?
            </h2>

            <button
                type="button"
                id="play-sound-button"
                class="yj-button">
                🔊 Geräusch abspielen
            </button>

            <div id="sound-answers">
                <!-- Antwortbuttons werden später mit JavaScript erzeugt -->
            </div>

            <p id="sound-message" aria-live="polite"></p>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=29"></script>
    <script src="JS/auth.js?v=8"></script>

    <script src="JS/sidebar.js?v=14"></script>
    <script src="JS/bugreport.js?v=1"></script>
    <script src="JS/tamagotchi.js?v=2"></script>
    <script src="JS/fireworks.js?v=1"></script>
    <script src="JS/sounds.js?v=1"></script>
    <script src="JS/fuchs.js?v=6"></script>

</body>

</html>
