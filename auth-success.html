<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <link
        rel="icon"
        type="image/png"
        href="images/magischer_baum_von_mirelon%20-favicon.png">

    <link
        rel="stylesheet"
        href="CSS/style.css?v=26">

    <link
        rel="stylesheet"
        href="CSS/components/index.css?v=16">

    <title>Authentifizierung erfolgreich – Mirelon</title>

    <style>
        /* Diese Seite hat bewusst keine Sidebar (nicht ueber die
           Navigation erreichbar, nur als Ziel fuer Bestaetigungs-
           Links aus Supabase-E-Mails gedacht) - daher hier der
           sonst fuer die Sidebar reservierte linke Rand entfernt. */
        main {
            margin-left: 0;
            justify-content: center;
        }

        .auth-success-card {
            max-width: 440px;
            padding: 44px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .auth-success-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .auth-success-card p {
            color: var(--yj-color-cream-soft);
            line-height: 1.5;
            margin-bottom: 18px;
        }
    </style>

</head>


<body>


    <!-- =====================================================
         AUTHENTIFIZIERUNG ERFOLGREICH
         Kein Link von irgendwo auf der Seite - das hier ist das
         Ziel, auf das Supabase nach Bestaetigung einer E-Mail
         (Registrierung, Passwort zuruecksetzen, ...) weiterleitet.
         Die Redirect-URL dafuer wird im Supabase-Dashboard unter
         Authentication -> URL Configuration eingetragen.
         ===================================================== -->

    <main id="auth-success-main" class="yj-page">

        <section class="auth-success-card yj-panel yj-panel--paper yj-enter">

            <div class="auth-success-icon" aria-hidden="true">🌳</div>

            <h1>Willkommen in Mirelon!</h1>

            <p>
                Deine E-Mail wurde erfolgreich bestätigt.
                Dein Konto ist jetzt aktiviert und du kannst
                dein Abenteuer beginnen.
            </p>

            <a href="index.html" class="yj-button yj-button--wide" data-auth-only hidden>
                🪶 Welt betreten
            </a>

            <button type="button" id="auth-success-login-btn" class="yj-button yj-button--wide" data-guest-only>
                🪶 Jetzt anmelden
            </button>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         Laedt auth.js, damit hier erkannt wird, ob die
         Bestaetigung den Nutzer schon automatisch eingeloggt
         hat (dann "Welt betreten") oder nicht (dann oeffnet
         "Jetzt anmelden" das normale Anmelde-Fenster).
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="JS/player.js?v=29"></script>
    <script src="JS/auth.js?v=8"></script>

    <script>
        document.getElementById("auth-success-login-btn").addEventListener("click", function () {
            openAccountPanel();
        });
    </script>


</body>

</html>
